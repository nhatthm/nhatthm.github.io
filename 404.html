<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nhat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/outfit.woff2?v=1" crossorigin>
<link rel="stylesheet" href="css/style.min.css?v=1">
</head>
<body>
<div class="page">
<a class="coffee-rail" href="https://donate.nhat.me" target="_blank" rel="noopener noreferrer">
  <img src="images/coffee-mug.svg" width="18" height="18" alt="">
  <span style="writing-mode:vertical-rl">Buy me a coffee</span>
</a>

<nav>
  <a href="/" class="nav-active">About me</a>
  <a href="https://go.nhat.io">Go registry</a>
  <a href="https://fonts.nhat.io">Ligaturized fonts</a>
</nav>

<div class="split">
  <div class="ghost-panel">
    <div class="box__ghost">
      <div class="symbol"></div>
      <div class="symbol"></div>
      <div class="symbol"></div>
      <div class="symbol"></div>
      <div class="symbol"></div>
      <div class="symbol"></div>
      <div class="box__ghost-container">
        <div class="box__ghost-eyes">
          <div class="box__eye-left"></div>
          <div class="box__eye-right"></div>
        </div>
        <div class="box__ghost-bottom">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
      <div class="box__ghost-shadow"></div>
    </div>
  </div>
  <div class="split-copy">
    <h1 class="split-title">Whoops!</h1>
    <p class="split-p">It seems like we couldn't find the page you were looking for. <a class="mark-link" href="/">Go back</a>.</p>
    <a class="btn-outline accent coffee-inline" href="https://donate.nhat.me" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
  </div>
</div>
</div>

<script>
(function () {
  var MAX_SHIFT = 10;

  document.addEventListener('mousemove', function (e) {
    var eyes = document.querySelector('.box__ghost-eyes');
    if (!eyes) return;
    var nx = (e.clientX / window.innerWidth) * 2 - 1;
    var ny = (e.clientY / window.innerHeight) * 2 - 1;
    eyes.style.transform = 'translate(calc(-50% + ' + (nx * MAX_SHIFT).toFixed(2) + 'px), ' + (ny * MAX_SHIFT).toFixed(2) + 'px)';
  });
})();
</script>
</body>
</html>
